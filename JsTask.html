<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 80px;
        transition: 0.5s;
      }

      h1 {
        font-size: 45px;
      }

      p {
        font-size: 22px;
        margin: 20px;
      }

      button {
        padding: 12px 25px;
        margin: 10px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
    <h1 id="headingElement">Web Technologies</h1>
    <p id="paragraphElement">
      HTML, CSS, and JavaScript are the building blocks of modern web
      development.
    </p>
    <button onclick="changeHeading()">Change Heading</button>
    <button onclick="changeColors()">Change Colors</button>
    <button onclick="resetPage()">Reset</button>

    <script>
      const colors = [
        "red",
        "blue",
        "green",
        "purple",
        "orange",
        "brown",
        "pink",
        "teal",
        "gold",
        "crimson",
        "darkcyan",
        "navy",
      ];

      function getRandomColor() {
        const randomIndex = Math.floor(Math.random() * colors.length);
        return colors[randomIndex];
      }

      function changeHeading() {
        document.getElementById("headingElement").textContent =
          "4.0 Technologies";
      }
      function changeColors() {
        document.getElementById("headingElement").style.color =
          getRandomColor();
        document.getElementById("paragraphElement").style.color =
          getRandomColor();
        document.body.style.backgroundColor = getRandomColor();
      }

      function resetPage() {
        document.getElementById("headingElement").textContent ="Web Technologies";
        document.getElementById("headingElement").style.color = "black";
        document.getElementById("paragraphElement").textContent =
          "HTML, CSS, and JavaScript are the building blocks of modern web development.";
        document.getElementById("paragraphElement").style.color = "black";
        document.body.style.backgroundColor = "white";
      }
    </script>
  </body>
</html>
