<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative App Ideas</title>
</head>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f9fc;
    }
    .navbar{
        display: flex;
        justify-content: space-between;
        padding: 20px 50px;
        background: rgb(244, 171, 211);
    }
    .logo {
        font-size: 22px;
        font-weight: bold;
        color: #4a4a8a;
        font-weight: bold;

    }
    .nav-links a {
        margin-left: 20px;
        text-decoration: none;
        color: #555;
        font-size: 14px;
        font-weight: bold;
    }
    .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 50px;
    }
    .left {
        width: 50%;
    }
    .left h1 {
        font-size: 40px;
        color: #4a4a8a;
    }
    .skill {
        margin: 20px 0;
    }
    .skill-name {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .bar{
        width: 100%;
        height: 8px;
        background: #ddd;
        border-radius: 5px;
        overflow: hidden;
    }
    .fill {
        height: 100%;
        border-radius: 5px;
    }
    .blue {background: #5aa9eb; }
    .pink {background: #ff6b81; }
    .green {background: #0ba45d;}
    .red {background: #ba2a2a;}

    .right img {
        width: 600px;
        height: 500px;
    }

</style>
<body>
    <div class="navbar">
        <div class="logo">bridge.</div>
        <div class="nav-links">
            <a href="#">HOME</a>
            <a href="#">PAGES</a>
            <a href="#">OUR SERVICES</a>
            <a href="#">CONTACT US</a>
        </div>
    </div>

    <div class="container">
        <div class="left">
            <h1>Creative App Ideas</h1>
        <div class="skill">
            <div class="skill-name">
                <span>Information Architecture</span>
                <span>70%</span>
            </div>
            <div class="bar">
                <div class="fill blue" style="width:70%;"></div>
            </div>
        </div>
        <div class="skill">
            <div class="skill-name">
                <span>App Development</span>
                <span>97%</span>
            </div>
            <div class="bar">
                <div class="fill green" style="width:97%;"></div>
            </div>
        </div>
        <div class="skill">
            <div class="skill-name">
                <span>User Interface</span>
                <span>92%</span>
            </div>
            <div class="bar">
                <div class="fill pink" style="width:92%;"></div>
            </div>
        </div>
        <div class="skill">
            <div class="skill-name">
                <span>Total Memory</span>
                <span>65%</span>
            </div>
            <div class="bar">
                <div class="fill red" style="width:65%;"></div>
            </div>
        </div>

        </div>
        <div class="right">
            <img src=https://connect.theoppty.com/media/message_files/2026/04/28/home-1-phone-11.png alt="illustration">
            
        </div>
    </div>
    
</body>
</html>
