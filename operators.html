<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <h1>JavaScript Operators</h1>
    <script>

      //   Types of JavaScript Operators

      // Arithmetic Operators

      const sum = 5 + 3; // Addition
      const diff = 10 - 2; // Subtraction
      const p = 4 * 2; // Multiplication
      const q = 8 / 2; // Division
      console.log(sum, diff, p, q);

      //Output: 8,8,8,4

      //Real time
      let amount = 500;
      let quantity = 2;

      let total = amount * quantity;

      console.log(total);

      // JavaScript Assignment Operators

      let n = 10;
      n += 5;
      n *= 2;
      console.log(n);
      //output: 30

      // JavaScript Comparison Operators

      console.log(10 > 5);
      console.log(10 === "10");
      //output: true, false

      //JavaScript Logical Operators  //AND / OR / NOT
      let username = "admin";
      let password = "1234";

      console.log(username === "admin" && password === "1234");

      //JavaScript Bitwise Operators
      const res = 5 & 1; // Bitwise AND
      console.log(res);
      //output: 1

      //JavaScript Ternary Operator
      const age1 = 18;
      const status = age1 >= 18 ? "Adult" : "Minor";
      console.log(status);
    </script>
  </body>
</html>
