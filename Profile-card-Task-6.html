<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
</head>
<style>
    body {
        background: #a9a6a6;
        font-family:Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #acd0e6;
    }
    .card {
        background: white;
        width: 300px;
        text-align: center;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        background-color: #fcfbfb;
    }
    .profile-img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 4px solid #6a5acd;
        object-fit: cover;
    }
    .h2 {
        margin: 10px 0 5px;
    }
    .role {
        color: grey;
        font-size: 14px;
    }
    .stats {
        display: flex;
        justify-content: space-around;
        margin: 20px;
        border-radius: 2px;
    }
   
    .stats p {    
        font-size: 12px;
        color: grey;
    }
    button{
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(to right, #6a5acd, #9b59b6);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.5s;
    }
</style>
<body>
    <div class="card">
        <img src="Assets/photo.jpeg" class="profile-img">
        <h2>Jonathan Doe</h2>
        <p class="role">Senior Product Designer</p>

        <div class="stats">

            <div>
                <h3>12.5k</h3>
                <p>Followers</p>
            </div>
            <div>
                <h3>843</h3>
                <p>Following</p>
            </div>
            <div>
                <h3>42</h3>
                <p>Projects</p>
            </div>
        </div>
        <button>Follow User</button>
    </div>
 </style>   
</body>
</html>
