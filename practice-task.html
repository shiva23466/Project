<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e")
          no-repeat center/cover;
        height: 100vh;
        object-fit: cover;
      }

      .navbar {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 2;
      }

      .nav-links a {
        color: white;
        margin: 0 10px;
        text-decoration: none;
      }

      #menu-toggle {
        display: none;
      }

      .hamburger {
        font-size: 28px;
        cursor: pointer;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: -250px;
        width: 250px;
        height: 100%;
        color: white;
        padding: 10px;
        transition: 0.3s;
        z-index: 4;
      }

      .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        margin: 15px 0;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        z-index: 2;
      }

      #menu-toggle:checked ~ .sidebar {
        left: 0;
      }

      #menu-toggle:checked ~ .overlay {
        opacity: 0.5;
        visibility: visible;
      }

      .content {
        margin-top: 80px;
        color: white;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <input type="checkbox" id="menu-toggle" />

    <div class="navbar">
      <div>
        <label for="menu-toggle" class="hamburger">☰</label>
        <span style="margin-left: 10px">MySite</span>
      </div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <div class="sidebar">
      <h2>Menu</h2>
      <vr>
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </div>

    <label for="menu-toggle" class="overlay"></label>

    <div class="content">
      <h1>Welcome</h1>
      <p>Sunrise Beach View </p>
    </div>
  </body>
</html>
