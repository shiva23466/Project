<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display Arrangement</title>
</head>
<style>
    body{
        font-family: Arial;
        background: #f0f0f0;
        padding: 20px;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 15px;
        width: 90%;
        margin: auto;
    }
   
    h3 {
        color: #3f51b5
    }
    img{
        width: 120px;
        height: 120px;
        border-radius: 10px;
        margin: 10px;
        object-fit: cover;
    }
    .block img{
        display: block;
        margin: 10px auto;
        width: 30%;
    }
    
    .flex {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin-top: 10px;
        gap: 15px;
    }
    .flex img{
        width: 30%;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(1fr, 1fr);
        gap: 15px;
        justify-items: center;
        margin-top: 10px;
    }
</style>
<body>
