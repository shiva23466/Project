    <script>
      const movies = [
        { id: 1, title: "Bahubali", rating: 9 },
        { id: 2, title: "Pushpa", rating: 8 },
        { id: 3, title: "RRR", rating: 10 },
        { id: 4, title: "Salaar", rating: 7 },
      ];

      // 1. Create a new array containing only movie titles.

      // Syntax : const newArray = array.map(item => item.property);

      const movieTitles = movies.map((movie) => movie.title);
      console.log(movieTitles);

      // 2. Create a new array containing only movie ratings.

      const movieRatings = movies.map((movie) => movie.rating);
      console.log(movieRatings);

      // 3. Increase every movie rating by 1.

      //   const newArray = array.map((item) => ({
      //     ...item,
      //     property: item.property + value,
      //   }));

      const updatedMovies = movies.map((movie) => ({
        ...movie,
        rating: movie.rating + 1,
      }));

      console.log(updatedMovies);

      // 4. Get all movies with rating greater than 8.

      const topMovies = movies.filter((movie) => movie.rating > 8);
      console.log(topMovies);

      // 5. Get all movies with rating less than 9.

      const bottomMovies = movies.filter((movie) => movie.rating < 9);
      console.log(bottomMovies);

      // 6. Find the movie with ID 3.

      const movie = movies.find((movie) => movie.id === 3);
      console.log(movie);

      // 7. Find the movie with title “Pushpa”.

      const pushpaMovie = movies.find((movie) => movie.title === "Pushpa");
      console.log(pushpaMovie);

      // 8. Calculate the total of all movie ratings

      const totalRatings = movies.reduce((sum, movie) => sum + movie.rating, 0);
      console.log(totalRatings);

      // Products-----------------------------------------------------------------------------------

      const products = [
        { id: 1, name: "Laptop", price: 50000 },
        { id: 2, name: "Mouse", price: 500 },
        { id: 3, name: "Keyboard", price: 1500 },
        { id: 4, name: "Monitor", price: 12000 },
      ];
      // 9. Create an array containing only product names.

      // Syntax : const newArray = array.map(item => item.property);

      const productNames = products.map((product) => product.name);
      console.log(productNames);

      // 10. Create an array containing only product prices.

      const productPrices = products.map((product) => product.price);
      console.log(productPrices);

      // 11. Increase every product price by ₹1000.

      const updatedProducts = products.map((product) => ({
        ...product,
        price: product.price + 1000,
      }));
      console.log(updatedProducts);

      //12. Get all products costing more than ₹1000.

      const costlyProducts = products.filter((product) => product.price > 1000);
      console.log(costlyProducts);

      // 13. Get all products costing less than ₹10000.

      const affordableProducts = products.filter(
        (product) => product.price < 10000,
      );
      console.log(affordableProducts);

      // 14. Find the product with ID 2.

      const productById = products.find((product) => product.id === 2);
      console.log(productById);

      // 15. Find the product named “Monitor”.

      const monitorProduct = products.find(
        (product) => product.name === "Monitor",
      );
      console.log(monitorProduct);

      // 16. Calculate the total cost of all products.

      const totalCost = products.reduce(
        (sum, product) => sum + product.price,
        0,
      );
      console.log(totalCost);

      // CRICKETSCORES---------------------------------------------------------------------------

      const scores = [45, 80, 20, 100, 60];

      // 17. Add 10 runs to every score.

      const updatedScores = scores.map((score) => score + 10);
      console.log(updatedScores);

      // 18.Add 5 runs to every score

      const updatedScores1 = scores.map((score) => score + 10);
      console.log(updatedScores1);

      // 19. Get all scores greater than 50.

      const result = scores.filter((score) => score > 50);
      console.log(result);

      // 20. Get all scores greater than or equal to 80.

      const result1 = scores.filter((score) => score >= 80);
      console.log(result1);

      // 21. Find the first score greater than 70.

      const result2 = scores.find((score) => score > 70);
      console.log(result2);
      
    </script>
